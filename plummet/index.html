<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>PLUMMET — المَهبَط</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none}
#c{display:block;width:100vw;height:100vh}

#hud{position:fixed;top:0;left:0;right:0;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
#score-wrap{text-align:center}
#score-lbl{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.4);text-transform:uppercase}
#score{font-size:44px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 24px rgba(0,210,255,.9)}
#best-wrap{text-align:left}
#best-lbl{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.3);text-transform:uppercase}
#best-val{font-size:22px;font-weight:700;color:rgba(255,255,255,.55)}

#lives{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none;z-index:10}
.heart{font-size:22px;transition:transform .2s,opacity .2s;filter:drop-shadow(0 0 6px #ff4466)}
.heart.dead{opacity:.2;transform:scale(.8);filter:none}

#energy-wrap{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:10}
#energy-lbl{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.35);text-transform:uppercase}
#energy-bg{width:140px;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
#energy-bar{height:100%;width:100%;background:linear-gradient(90deg,#00c8ff,#a855f7);border-radius:3px;transition:width .1s;box-shadow:0 0 8px #00c8ff}

#speed-wrap{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10}
#speed-val{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.35);text-transform:uppercase}

#combo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:52px;font-weight:900;color:#ffd700;text-shadow:0 0 30px #ffd700,0 0 60px #ff8c00;pointer-events:none;z-index:20;opacity:0;transition:transform .12s cubic-bezier(.34,1.56,.64,1),opacity .25s;white-space:nowrap}
#combo.show{transform:translate(-50%,-50%) scale(1);opacity:1}

#milestone{position:fixed;top:98px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.55);text-transform:uppercase;pointer-events:none;z-index:10;opacity:0;transition:opacity .3s}
#milestone.show{opacity:1}

#biome{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:15;opacity:0;transition:opacity .5s}
#biome.show{opacity:1}
#biome-name{font-size:26px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:#fff;text-shadow:0 0 20px currentColor}
#biome-sub{font-size:11px;letter-spacing:5px;color:rgba(255,255,255,.45);margin-top:4px;text-transform:uppercase}

#perfect-flash,#death-flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity .05s}
#perfect-flash{background:radial-gradient(circle at center,rgba(0,200,255,.4),transparent 70%)}
#death-flash{background:radial-gradient(circle at center,rgba(255,40,40,.5),transparent 70%)}
#perfect-flash.on,#death-flash.on{opacity:1}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;background:rgba(0,0,0,.85);backdrop-filter:blur(10px)}
.screen.hidden{display:none}
#start-screen{background:radial-gradient(ellipse at center,rgba(0,22,50,.95),rgba(0,0,0,.98))}
.logo{font-size:76px;font-weight:900;letter-spacing:-3px;line-height:1;background:linear-gradient(135deg,#00c8ff 0%,#a855f7 50%,#ff6b9d 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:glow 2.2s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 18px rgba(0,200,255,.6))}to{filter:drop-shadow(0 0 42px rgba(168,85,247,.8))}}
.tagline{font-size:13px;letter-spacing:6px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-top:6px;margin-bottom:48px}
.how{display:flex;flex-direction:column;gap:12px;margin-bottom:48px}
.how-row{display:flex;align-items:center;gap:14px;justify-content:center}
.how-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);flex-shrink:0}
.how-text{font-size:13px;color:rgba(255,255,255,.65);text-align:right}
.btn{background:linear-gradient(135deg,#00c8ff,#a855f7);border:none;border-radius:50px;padding:17px 60px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:2px;box-shadow:0 0 28px rgba(0,200,255,.4);transition:transform .15s,box-shadow .15s;pointer-events:all;text-transform:uppercase}
.btn:hover{transform:scale(1.04);box-shadow:0 0 42px rgba(0,200,255,.6)}
.btn:active{transform:scale(.97)}

#gameover-screen{gap:8px}
.go-title{font-size:46px;font-weight:900;color:#fff;letter-spacing:3px;text-transform:uppercase}
.go-dist{font-size:84px;font-weight:900;color:#00c8ff;line-height:1;text-shadow:0 0 30px #00c8ff}
.go-m{font-size:12px;letter-spacing:4px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:6px}
.go-best{font-size:15px;color:rgba(255,255,255,.45);margin-bottom:32px}
.go-best span{color:#ffd700;font-weight:700}
#new-best{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;font-size:11px;font-weight:800;letter-spacing:2px;padding:3px 12px;border-radius:20px;text-transform:uppercase;display:none;margin-bottom:8px}
#new-best.show{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="score-wrap"><div id="score-lbl">المسافة</div><div id="score">0</div></div>
  <div id="best-wrap"><div id="best-lbl">أفضل</div><div id="best-val">0</div></div>
</div>

<div id="lives">
  <span class="heart" id="h0">♥</span>
  <span class="heart" id="h1">♥</span>
  <span class="heart" id="h2">♥</span>
</div>

<div id="energy-wrap">
  <div id="energy-lbl">طاقة النبضة</div>
  <div id="energy-bg"><div id="energy-bar"></div></div>
</div>
<div id="speed-wrap"><div id="speed-val">0 م/ث</div></div>

<div id="combo"></div>
<div id="milestone"></div>
<div id="biome"><div id="biome-name"></div><div id="biome-sub">— منطقة جديدة —</div></div>
<div id="perfect-flash"></div>
<div id="death-flash"></div>

<div id="start-screen" class="screen">
  <div class="logo">PLUMMET</div>
  <div class="tagline">المَهبَط — اسقط. تفادَ. ابقَ حياً.</div>
  <div class="how">
    <div class="how-row"><div class="how-icon">↔</div><div class="how-text">اسحب يميناً أو يساراً للتحرك</div></div>
    <div class="how-row"><div class="how-icon">✦</div><div class="how-text">انقر / Space لنبضة تكشف العقبات</div></div>
    <div class="how-row"><div class="how-icon">◆</div><div class="how-text">اجمع الكريستال — شحن + مضاعف كومبو</div></div>
    <div class="how-row"><div class="how-icon">♥</div><div class="how-text">3 أرواح — الاصطدام يخسر روحاً</div></div>
  </div>
  <button class="btn" id="btn-start">ابدأ اللعبة</button>
</div>

<div id="gameover-screen" class="screen hidden">
  <div class="go-title">انتهت اللعبة</div>
  <div id="new-best">🏆 رقم قياسي جديد!</div>
  <div class="go-dist" id="go-dist">0</div>
  <div class="go-m">متر</div>
  <div class="go-best">أفضل نتيجة: <span id="go-best-val">0</span> م</div>
  <button class="btn" id="btn-retry">العب مجدداً</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const C = {
  TR:4.4, BR:0.24,
  SPD0:18, SPDMAX:72, SPD_BASE:1.009, SPD_SCALE:9,
  LATMAX_BASE:3.2, LATMAX_MIN:1.9, LATSMOOTH:0.19,
  CAM_BACK:4.6, CAM_Y:0.75, CAM_LOOK:14,
  FOG_N:7, FOG_F:30, PULSE_FOG:68,
  PULSE_DUR:0.52, PULSE_COST:0.28,
  ENERGY_REG:0.0085,
  CRYSTAL_E:0.33,
  INVTIME:2.1,
  SHAKE_DEC:9,
  LIVES:3,
  BIOME_M:650,
  CHUNK_LEN:220,
};

const BIOMES = [
  {name:'النفق الكوني',   fog:0x000c18,wall:0x001028,glow:0x00c8ff,ball:0x00e0ff,obs:0xff1a44,crystal:0xffd700},
  {name:'الكهف البركاني',fog:0x0f0400, wall:0x280800,glow:0xff4400,ball:0xff5c1a,obs:0x00ffcc,crystal:0xffbb00},
  {name:'الجليد الأبدي', fog:0x000816, wall:0x000c20,glow:0x7799ff,ball:0xaaccff,obs:0xff44aa,crystal:0x00ffe8},
  {name:'الكون الذهبي',  fog:0x070500, wall:0x140e00,glow:0xffcc00,ball:0xffd700,obs:0xff00bb,crystal:0x00ffcc},
];

// ══════════════════════════════════════════
// OBSTACLE PATTERNS  (GD-style)
// Each entry: array of obstacle defs, z is relative offset within pattern
// t: 'W'=wall, 'CW'=closing wall, 'P'=pillar
// w: half-gap-width, x: gap center x
// ══════════════════════════════════════════
const PAT = {
  EASY:[
    [{t:'W',x:0,    w:1.25,z:0}],
    [{t:'W',x:-1.1, w:1.15,z:0},{t:'W',x:1.1,w:1.15,z:22}],
    [{t:'W',x:0.8,  w:1.2, z:0},{t:'W',x:-0.8,w:1.2,z:18}],
    [{t:'P',x:-1.4, z:0},        {t:'P',x:1.4,z:20}],
    [{t:'W',x:0,    w:1.3, z:0}, {t:'P',x:1.6,z:14}],
  ],
  MEDIUM:[
    [{t:'W',x:0,   w:1.0,z:0},{t:'W',x:0,  w:0.95,z:14},{t:'W',x:0,w:0.9,z:28}],
    [{t:'CW',x:0,  w:1.1,z:0,minW:0.65}],
    [{t:'W',x:-1.2,w:1.0,z:0},{t:'W',x:1.2,w:1.0,z:12},{t:'W',x:0,w:1.0,z:24}],
    [{t:'P',x:-1.6,z:0},{t:'P',x:0,z:11},{t:'P',x:1.6,z:22}],
    [{t:'CW',x:0.8,w:1.05,z:0,minW:0.6},{t:'W',x:-0.8,w:1.0,z:18}],
    [{t:'W',x:-1.0,w:0.95,z:0},{t:'CW',x:0.9,w:1.0,z:16,minW:0.6}],
  ],
  HARD:[
    [{t:'W',x:0,   w:0.82,z:0},{t:'W',x:0,w:0.78,z:10},{t:'W',x:0,w:0.74,z:20},{t:'W',x:0,w:0.7,z:30}],
    [{t:'CW',x:0,  w:0.95,z:0,minW:0.52},{t:'P',x:1.8,z:16}],
    [{t:'P',x:-1.8,z:0},{t:'W',x:0,w:0.8,z:8},{t:'P',x:1.8,z:18},{t:'W',x:0,w:0.76,z:26}],
    [{t:'CW',x:-1.0,w:0.88,z:0,minW:0.5},{t:'CW',x:1.0,w:0.88,z:14,minW:0.5}],
    [{t:'W',x:1.2, w:0.78,z:0},{t:'W',x:-1.2,w:0.78,z:11},{t:'W',x:0,w:0.72,z:22}],
  ],
  NIGHTMARE:[
    [{t:'CW',x:0,  w:0.82,z:0,minW:0.42},{t:'CW',x:0,w:0.78,z:13,minW:0.4}],
    [{t:'W',x:0,   w:0.68,z:0},{t:'P',x:-1.9,z:6},{t:'W',x:0,w:0.64,z:12},{t:'P',x:1.9,z:18},{t:'W',x:0,w:0.6,z:24}],
    [{t:'P',x:-1.8,z:0},{t:'P',x:0,z:7},{t:'P',x:1.8,z:14},{t:'P',x:-1.8,z:21},{t:'P',x:0,z:28}],
    [{t:'CW',x:1.1,w:0.76,z:0,minW:0.38},{t:'CW',x:-1.1,w:0.76,z:11,minW:0.38},{t:'W',x:0,w:0.62,z:22}],
  ],
};

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let G = {};

function resetG() {
  G = {
    phase:'start', dist:0, speed:C.SPD0, energy:1,
    lives:C.LIVES, combo:0,
    best: +localStorage.getItem('pm_best')||0,
    biome:0,
    pulsing:false, pulseT:0,
    invinc:false,  invincT:0,
    shakeI:0,
    camPunchX:0, camPunchY:0,
    slowmo:1, slowmoT:0,
    targetX:0, lastMile:0,
    caStrength:0, glitchStrength:0,
    nearMissTimer:0,
  };
}
resetG();

// dynamic lateral limit narrows with speed
function latMax(){ return C.LATMAX_BASE - (C.LATMAX_BASE-C.LATMAX_MIN)*Math.min(1,(G.speed-C.SPD0)/(C.SPDMAX-C.SPD0)); }

// ══════════════════════════════════════════
// RENDERER + SCENE
// ══════════════════════════════════════════
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 380);

// ── PostFX chain ──
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.4, 0.52, 0.15);
composer.addPass(bloom);

// Chromatic Aberration + Glitch combined shader
const PostFXShader = {
  uniforms:{
    tDiffuse:   {value:null},
    caStrength: {value:0.0},
    glitchStr:  {value:0.0},
    time:       {value:0.0},
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }
  `,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float caStrength;
    uniform float glitchStr;
    uniform float time;
    varying vec2 vUv;

    float rand(vec2 co){ return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453); }

    void main(){
      vec2 uv = vUv;

      // Glitch block displacement
      if(glitchStr > 0.01){
        float slice = floor(uv.y * 24.0) / 24.0;
        float r = rand(vec2(slice, floor(time * 18.0)));
        if(r > 0.72) uv.x += (rand(vec2(slice, time)) - 0.5) * glitchStr * 0.08;
      }

      // Chromatic aberration
      float ca = caStrength * 0.015;
      float r = texture2D(tDiffuse, vec2(uv.x + ca, uv.y)).r;
      float g = texture2D(tDiffuse, uv).g;
      float b = texture2D(tDiffuse, vec2(uv.x - ca, uv.y)).b;

      // Subtle vignette
      float vign = 1.0 - smoothstep(0.55, 1.2, length(uv - 0.5) * 1.6);

      gl_FragColor = vec4(vec3(r, g, b) * vign, 1.0);
    }
  `,
};
const fxPass = new ShaderPass(PostFXShader);
composer.addPass(fxPass);
composer.addPass(new OutputPass());

scene.fog = new THREE.Fog(BIOMES[0].fog, C.FOG_N, C.FOG_F);
scene.background = new THREE.Color(BIOMES[0].fog);

scene.add(new THREE.AmbientLight(0xffffff, 0.06));
const ballLight  = new THREE.PointLight(0x00c8ff, 4.5, 15);
const pulseLight = new THREE.PointLight(0x00c8ff, 0, 55);
scene.add(ballLight, pulseLight);

// ══════════════════════════════════════════
// BALL
// ══════════════════════════════════════════
const ballMesh = new THREE.Mesh(
  new THREE.SphereGeometry(C.BR, 28, 28),
  new THREE.MeshStandardMaterial({color:0x00e0ff,emissive:0x00b0e0,emissiveIntensity:2.2,roughness:.05,metalness:.4})
);
scene.add(ballMesh);

const ballGlow = new THREE.Mesh(
  new THREE.SphereGeometry(C.BR*2.2, 14, 14),
  new THREE.MeshBasicMaterial({color:0x00a8e0,transparent:true,opacity:.14,side:THREE.BackSide})
);
scene.add(ballGlow);

const shockMat = new THREE.MeshBasicMaterial({color:0x00c8ff,transparent:true,opacity:0,side:THREE.DoubleSide});
const shockRing = new THREE.Mesh(new THREE.RingGeometry(.1,.45,32), shockMat);
shockRing.rotation.x = Math.PI/2;
scene.add(shockRing);
let shockLife=0, shockScale=1;

// ══════════════════════════════════════════
// SPRITE TEXTURE
// ══════════════════════════════════════════
function makeSprite() {
  const cv=document.createElement('canvas'); cv.width=cv.height=64;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.5,'rgba(255,255,255,.6)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}
const sprite = makeSprite();

// ══════════════════════════════════════════
// SPEED LINES
// ══════════════════════════════════════════
const SL_COUNT = 80;
const slPos  = new Float32Array(SL_COUNT*3);
const slSize = new Float32Array(SL_COUNT);
const slData = new Float32Array(SL_COUNT*2); // r, angle per line
const slGeo  = new THREE.BufferGeometry();
slGeo.setAttribute('position', new THREE.BufferAttribute(slPos,3));
slGeo.setAttribute('size',     new THREE.BufferAttribute(slSize,1));
const slMat = new THREE.ShaderMaterial({
  uniforms:{tex:{value:sprite}},
  vertexShader:`
    attribute float size;
    void main(){
      vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=size*(160./-mv.z);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform sampler2D tex;
    void main(){ gl_FragColor=texture2D(tex,gl_PointCoord)*vec4(1.,1.,1.,0.55); }`,
  blending:THREE.AdditiveBlending, depthWrite:false, transparent:true,
});
const slPoints = new THREE.Points(slGeo, slMat);
scene.add(slPoints);

// init random radial placement
for(let i=0;i<SL_COUNT;i++){
  slData[i*2]  = 0.4+Math.random()*2.8; // radius
  slData[i*2+1]= Math.random()*Math.PI*2; // angle
}

function updateSpeedLines() {
  const t = Math.max(0,(G.speed-C.SPD0)/(C.SPDMAX-C.SPD0));
  const bx=ballMesh.position.x, by=ballMesh.position.y, bz=ballMesh.position.z;
  for(let i=0;i<SL_COUNT;i++){
    let r = slData[i*2], ang = slData[i*2+1];
    // drift outward then reset
    r += G.speed * 0.002;
    if(r > 3.8){ r = 0.3+Math.random()*0.5; ang = Math.random()*Math.PI*2; }
    slData[i*2] = r;
    const j=i*3;
    slPos[j]   = bx + Math.cos(ang)*r;
    slPos[j+1] = by + Math.sin(ang)*r;
    slPos[j+2] = bz - 1.5 - Math.random()*4;
    slSize[i] = t * (1.2 + r*0.4);
  }
  slGeo.attributes.position.needsUpdate=true;
  slGeo.attributes.size.needsUpdate=true;
}

// ══════════════════════════════════════════
// TRAIL
// ══════════════════════════════════════════
const TRAIL=32;
const trailPos  = new Float32Array(TRAIL*3);
const trailSize = new Float32Array(TRAIL);
const trailGeo  = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos,3));
trailGeo.setAttribute('size',     new THREE.BufferAttribute(trailSize,1));

const trailMat = new THREE.ShaderMaterial({
  uniforms:{tex:{value:sprite}},
  vertexShader:`
    attribute float size;
    void main(){
      vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=size*(180./-mv.z);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform sampler2D tex;
    void main(){ gl_FragColor=texture2D(tex,gl_PointCoord); }`,
  blending:THREE.AdditiveBlending, depthWrite:false, transparent:true,
});
scene.add(new THREE.Points(trailGeo, trailMat));
let trailHead=0, trailTimer=0;

function updateTrail(dt) {
  trailTimer-=dt;
  if(trailTimer<=0){
    trailTimer=0.015;
    const i=(trailHead%TRAIL)*3;
    trailPos[i]=ballMesh.position.x;
    trailPos[i+1]=ballMesh.position.y;
    trailPos[i+2]=ballMesh.position.z;
    trailHead++;
  }
  for(let i=0;i<TRAIL;i++) trailSize[i]=Math.max(0,(1-(trailHead-i)/TRAIL)*11);
  trailGeo.attributes.position.needsUpdate=true;
  trailGeo.attributes.size.needsUpdate=true;
}

// ══════════════════════════════════════════
// PARTICLES
// ══════════════════════════════════════════
const PMAX=90;
const pPos=new Float32Array(PMAX*3), pVel=new Float32Array(PMAX*3);
const pSize=new Float32Array(PMAX),  pLife=new Float32Array(PMAX);
const pCol=new Float32Array(PMAX*3);
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('size',     new THREE.BufferAttribute(pSize,1));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol,3));

const pMat=new THREE.ShaderMaterial({
  uniforms:{tex:{value:sprite}},
  vertexShader:`
    attribute float size; attribute vec3 color; varying vec3 vc;
    void main(){
      vc=color;
      vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=size*(240./-mv.z);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform sampler2D tex; varying vec3 vc;
    void main(){ gl_FragColor=vec4(vc,1.)*texture2D(tex,gl_PointCoord); }`,
  blending:THREE.AdditiveBlending, depthWrite:false, transparent:true,
});
scene.add(new THREE.Points(pGeo, pMat));

function burst(pos, col1, col2, n=45) {
  const c1=new THREE.Color(col1), c2=new THREE.Color(col2);
  let done=0;
  for(let i=0;i<PMAX&&done<n;i++){
    if(pLife[i]>0) continue;
    const j=i*3, sp=1.5+Math.random()*9;
    const th=Math.random()*Math.PI*2, ph=Math.random()*Math.PI;
    pPos[j]  =pos.x+(Math.random()-.5)*.4;
    pPos[j+1]=pos.y+(Math.random()-.5)*.4;
    pPos[j+2]=pos.z+(Math.random()-.5)*.4;
    pVel[j]  =Math.sin(ph)*Math.cos(th)*sp;
    pVel[j+1]=Math.sin(ph)*Math.sin(th)*sp*.6;
    pVel[j+2]=Math.cos(ph)*sp;
    const c=Math.random()<.5?c1:c2;
    pCol[j]=c.r; pCol[j+1]=c.g; pCol[j+2]=c.b;
    pSize[i]=3+Math.random()*9;
    pLife[i]=.7+Math.random()*.65;
    done++;
  }
}

function updateParticles(dt) {
  for(let i=0;i<PMAX;i++){
    if(pLife[i]<=0){ pSize[i]=0; continue; }
    pLife[i]-=dt;
    const j=i*3;
    pPos[j]  +=pVel[j]*dt;
    pPos[j+1]+=pVel[j+1]*dt;
    pPos[j+2]+=pVel[j+2]*dt;
    pVel[j+1]-=6*dt;
    pSize[i]=Math.max(0,pLife[i]*11);
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.size.needsUpdate=true;
}

// ══════════════════════════════════════════
// SOUND
// ══════════════════════════════════════════
let actx=null, ambNodes=[];

function initAudio(){ if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)(); }

function tone(freq, type, dur, vol=.22, delay=0){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.connect(g); g.connect(actx.destination);
  o.type=type; o.frequency.value=freq;
  const t=actx.currentTime+delay;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t); o.stop(t+dur);
}

function noise(dur, vol=.3, cut=1000){
  if(!actx) return;
  const n=Math.floor(actx.sampleRate*dur), b=actx.createBuffer(1,n,actx.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=actx.createBufferSource(), f=actx.createBiquadFilter(), g=actx.createGain();
  f.frequency.value=cut; s.buffer=b;
  s.connect(f); f.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
  s.start();
}

const snd = {
  crystal(){ [523,698,880,1175].forEach((f,i)=>tone(f,'sine',.12,.2,i*.055)); },
  pulse(){ tone(660,'sine',.07,.3); tone(1100,'triangle',.18,.18,.04); noise(.06,.12,5000); },
  nearMiss(){ tone(280,'sawtooth',.06,.16); tone(420,'triangle',.09,.12,.04); noise(.05,.1,900); },
  combo(n){ const f=200+Math.min(n,14)*50; tone(f,'sine',.25,.28); tone(f*1.5,'triangle',.12,.14,.08); },
  heartLost(){ tone(220,'sawtooth',.15,.28); tone(150,'square',.26,.22,.1); },
  death(){
    noise(.7,.45,700);
    if(!actx) return;
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g); g.connect(actx.destination); o.type='sawtooth';
    o.frequency.setValueAtTime(380,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(28,actx.currentTime+1.1);
    g.gain.setValueAtTime(.38,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+1.1);
    o.start(); o.stop(actx.currentTime+1.1);
  },
  startAmb(){
    if(!actx) return;
    [[55,.07],[82.4,.035],[110,.022]].forEach(([f,v])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(actx.destination);
      g.gain.value=v; o.start(); ambNodes.push(o);
    });
  },
  stopAmb(){ ambNodes.forEach(o=>{try{o.stop()}catch(e){}});  ambNodes=[]; },
};

// ══════════════════════════════════════════
// TUNNEL CHUNKS  (octagonal cross-section)
// ══════════════════════════════════════════
let chunkZ=0;
const chunks=[], obsPool=[], cryPool=[];

function buildChunk(startZ) {
  const b=BIOMES[G.biome];
  const grp=new THREE.Group();

  // Octagonal tube (8 segments, back-face visible from inside)
  const tGeo=new THREE.CylinderGeometry(C.TR,C.TR,C.CHUNK_LEN,8,1,true);
  const tMat=new THREE.MeshStandardMaterial({
    color:b.wall, emissive:new THREE.Color(b.glow).multiplyScalar(.10),
    side:THREE.BackSide, roughness:.75, metalness:.08,
  });
  const tube=new THREE.Mesh(tGeo,tMat);
  tube.rotation.x=Math.PI/2; grp.add(tube);

  // Edge glow lines along the 8 octagon edges
  for(let a=0;a<8;a++){
    const angle=(a/8)*Math.PI*2 + Math.PI/8;
    const px=Math.sin(angle)*(C.TR-.04), py=Math.cos(angle)*(C.TR-.04);
    const pts=[new THREE.Vector3(px,py,-C.CHUNK_LEN/2), new THREE.Vector3(px,py,C.CHUNK_LEN/2)];
    grp.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:b.glow,transparent:true,opacity:.28})
    ));
  }

  // Neon rings every 24 units
  for(let z=16;z<C.CHUNK_LEN;z+=24){
    const rGeo=new THREE.TorusGeometry(C.TR,.05,8,8);
    const rMat=new THREE.MeshBasicMaterial({color:b.glow,transparent:true,opacity:.22});
    const ring=new THREE.Mesh(rGeo,rMat);
    ring.position.z=z-C.CHUNK_LEN/2; grp.add(ring);
  }

  grp.position.set(0,0,startZ+C.CHUNK_LEN/2);
  scene.add(grp);

  const obs=spawnObs(startZ);
  const cry=spawnCry(startZ);
  chunks.push({grp,startZ,endZ:startZ+C.CHUNK_LEN,obs,cry});
}

function manageChunks(){
  const cz=-camera.position.z;
  while(chunkZ<cz+C.CHUNK_LEN*2.2){ buildChunk(chunkZ); chunkZ+=C.CHUNK_LEN; }
  for(let i=chunks.length-1;i>=0;i--){
    if(chunks[i].endZ<cz-25){
      scene.remove(chunks[i].grp);
      chunks[i].obs.forEach(o=>{o.mesh.visible=false;obsPool.push(o.mesh);});
      chunks[i].cry.forEach(c=>{if(!c.hit){c.mesh.visible=false;cryPool.push(c.mesh);}});
      chunks.splice(i,1);
    }
  }
}

// ══════════════════════════════════════════
// OBSTACLE MESHES
// ══════════════════════════════════════════
function newWallMesh() {
  const grp=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0xff1a44,emissive:0xff0033,emissiveIntensity:1.5,roughness:.2});
  const L=new THREE.Mesh(new THREE.BoxGeometry(2.4,.54,.32),mat);
  const R=L.clone();
  grp.add(L,R);
  grp.userData={type:'wall',L,R};
  scene.add(grp); return grp;
}

function newPillarMesh() {
  const grp=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0xff2200,emissive:0xff1100,emissiveIntensity:1.8,roughness:.15,metalness:.5});
  const core=new THREE.Mesh(new THREE.OctahedronGeometry(.52,1),mat);
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.88,.055,6,24),
    new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:.65})
  );
  ring.rotation.x=Math.PI/2;
  grp.add(core,ring);
  grp.userData={type:'pillar',core,ring,rotSpeed:.8+Math.random()*1.2};
  scene.add(grp); return grp;
}

function getObsMesh(type) {
  for(let i=obsPool.length-1;i>=0;i--)
    if(obsPool[i].userData.type===type) return obsPool.splice(i,1)[0];
  return type==='wall'||type==='CW'?newWallMesh():newPillarMesh();
}

// ══════════════════════════════════════════
// PATTERN-BASED SPAWNING
// ══════════════════════════════════════════
function difficultyTier() {
  if(G.dist < 200)  return 'EASY';
  if(G.dist < 500)  return 'MEDIUM';
  if(G.dist < 900)  return 'HARD';
  return 'NIGHTMARE';
}

function spawnObs(startZ) {
  const obs=[];
  const tier=difficultyTier();
  const patterns=PAT[tier];
  // Density: more patterns per chunk at higher difficulty
  const density = { EASY:0.42, MEDIUM:0.58, HARD:0.72, NIGHTMARE:0.88 }[tier];
  const spacing = { EASY:44,   MEDIUM:36,   HARD:28,   NIGHTMARE:20  }[tier];

  let z = startZ + 28;
  while(z < startZ + C.CHUNK_LEN - 20){
    if(Math.random() < density){
      const pat = patterns[Math.floor(Math.random()*patterns.length)];
      for(const def of pat){
        const type = def.t==='P' ? 'pillar' : 'wall';
        const mesh = getObsMesh(type);
        mesh.visible=true; mesh.userData.active=true;
        const absZ = z + (def.z||0);

        if(def.t==='W'||def.t==='CW'){
          const gapX = def.x * (latMax()/C.LATMAX_BASE);
          const gapW = (def.w||1.0) * 2;
          mesh.userData.L.position.set(gapX-gapW/2-1.2,0,0);
          mesh.userData.R.position.set(gapX+gapW/2+1.2,0,0);
          mesh.userData.gapX=gapX;
          mesh.userData.gapW=gapW;
          mesh.userData.currentGapX=gapX;
          mesh.userData.isCW = def.t==='CW';
          mesh.userData.cwMinW = def.minW ? def.minW*2 : gapW*0.55;
          mesh.userData.cwInitW = gapW;
          mesh.userData.slides = !def.t==='CW' && Math.random()<0.22;
          mesh.userData.slideSpd=(Math.random()<.5?1:-1)*(.5+Math.random()*.8);
          mesh.userData.slidePhase=Math.random()*Math.PI*2;
          mesh.position.set(0,0,-absZ);
          obs.push({mesh,z:absZ,type:'wall'});
        } else {
          const px = def.x * (latMax()/C.LATMAX_BASE);
          mesh.position.set(px,0,-absZ);
          mesh.userData.pillarX=px;
          obs.push({mesh,z:absZ,type:'pillar'});
        }
      }
      z += spacing + Math.random()*18;
    } else {
      z += 14 + Math.random()*12;
    }
  }
  return obs;
}

// ══════════════════════════════════════════
// CRYSTALS
// ══════════════════════════════════════════
function newCryMesh() {
  const mat=new THREE.MeshStandardMaterial({
    color:0xffd700,emissive:0xffaa00,emissiveIntensity:2.6,
    roughness:0,metalness:.9,transparent:true,opacity:.93,
  });
  const mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.21,0),mat);
  mesh.add(new THREE.PointLight(0xffd700,1.8,4));
  scene.add(mesh); return mesh;
}

function spawnCry(startZ) {
  const cry=[]; let z=startZ+18;
  while(z<startZ+C.CHUNK_LEN-12){
    if(Math.random()<.24){
      const m=cryPool.pop()||newCryMesh();
      m.position.set((Math.random()-.5)*latMax()*1.5,0,-z);
      m.visible=true;
      cry.push({mesh:m,z,hit:false});
    }
    z+=20+Math.random()*24;
  }
  return cry;
}

// ══════════════════════════════════════════
// COLLISION
// ══════════════════════════════════════════
function checkCollisions() {
  if(G.invinc) return;
  const bx=ballMesh.position.x, bz=-ballMesh.position.z, M=C.BR+.07;

  for(const ch of chunks){
    for(const c of ch.cry){
      if(c.hit) continue;
      if(Math.abs(c.z-bz)<.65&&Math.abs(c.mesh.position.x-bx)<.58){
        c.hit=true; c.mesh.visible=false;
        G.energy=Math.min(1,G.energy+C.CRYSTAL_E);
        G.combo=Math.min(G.combo+1,24);
        snd.crystal(); showCombo();
        burst(c.mesh.position,BIOMES[G.biome].crystal,0xffffff,14);
        updEnergy();
      }
    }

    for(const o of ch.obs){
      if(!o.mesh.userData.active) continue;
      const dz=Math.abs(o.z-bz);
      if(dz>1.6) continue;

      if(o.type==='wall'){
        const gx=o.mesh.userData.currentGapX;
        const gw=o.mesh.userData.gapW;
        const inGap=Math.abs(bx-gx)<gw/2-M*.4;
        if(!inGap&&dz<.95){
          hitBy(o);
        } else if(inGap&&dz<.5){
          const clearance = gw/2 - Math.abs(bx-gx);
          if(clearance < gw*0.22){ nearMissJuice(); }
        }
      } else {
        const px=o.mesh.userData.pillarX;
        if(Math.abs(bx-px)<.8+M&&dz<.85) hitBy(o);
        else if(Math.abs(bx-px)<1.3+M&&dz<.95) nearMissJuice();
      }
    }
  }
}

function nearMissJuice(){
  if(G.nearMissTimer>0) return;
  G.nearMissTimer=0.35;
  G.combo=Math.min(G.combo+1,24);
  snd.nearMiss(); showCombo();
  // bloom spike + CA spike + camera punch
  bloom.strength = Math.min(bloom.strength+0.9, 3.2);
  G.caStrength = Math.min(G.caStrength+1.8, 3.0);
  G.camPunchX += (Math.random()-.5)*0.04;
  G.camPunchY += (Math.random()-.5)*0.04;
}

function hitBy(o) {
  o.mesh.userData.active=false;
  G.lives--; G.combo=0;
  G.invinc=true; G.invincT=C.INVTIME;
  burst(ballMesh.position,BIOMES[G.biome].ball,0xffffff,G.lives>0?30:65);
  G.shakeI=G.lives>0?.32:.8;
  G.caStrength=2.8; G.glitchStrength=1.0;
  G.camPunchX=(Math.random()-.5)*0.12;
  G.camPunchY=(Math.random()-.5)*0.12;
  flash('death-flash');
  if(G.lives<=0){ snd.death(); G.phase='dead'; setTimeout(()=>showGameOver(),1400); }
  else { snd.heartLost(); updLives(); }
}

// ══════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════
let touchX0=0,touchXL=0,tdx=0,tswipe=false;
let mdown=false,mx0=0,mxL=0,mdx=0,mswipe=false;
let kL=false,kR=false;

function setupInput(){
  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    touchX0=touchXL=e.touches[0].clientX; tdx=0; tswipe=false;
    if(G.phase==='start') doStart();
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    tdx=e.touches[0].clientX-touchXL; touchXL=e.touches[0].clientX;
    if(Math.abs(touchXL-touchX0)>7) tswipe=true;
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    e.preventDefault();
    if(!tswipe&&G.phase==='playing') doPulse();
    tdx=0; tswipe=false;
  },{passive:false});

  canvas.addEventListener('mousedown',e=>{
    mdown=true; mx0=mxL=e.clientX; mdx=0; mswipe=false;
    if(G.phase==='start') doStart();
  });
  canvas.addEventListener('mousemove',e=>{
    if(!mdown) return;
    mdx=e.clientX-mxL; mxL=e.clientX;
    if(Math.abs(e.clientX-mx0)>7) mswipe=true;
  });
  canvas.addEventListener('mouseup',()=>{
    if(!mswipe&&G.phase==='playing') doPulse();
    mdown=false; mdx=0; mswipe=false;
  });
  canvas.addEventListener('mouseleave',()=>{ mdown=false; mdx=0; });

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='a') kL=true;
    if(e.key==='ArrowRight'||e.key==='d') kR=true;
    if(e.key===' '){
      e.preventDefault();
      if(G.phase==='playing')  doPulse();
      if(G.phase==='start')    doStart();
      if(G.phase==='over')     doRestart();
    }
  });
  document.addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft'||e.key==='a') kL=false;
    if(e.key==='ArrowRight'||e.key==='d') kR=false;
  });
}

// ══════════════════════════════════════════
// PULSE
// ══════════════════════════════════════════
function doPulse() {
  if(G.energy<C.PULSE_COST) return;
  G.energy-=C.PULSE_COST;
  G.pulsing=true; G.pulseT=C.PULSE_DUR;
  snd.pulse();
  shockLife=1; shockScale=.5;
  shockRing.position.copy(ballMesh.position);
  shockMat.color.setHex(BIOMES[G.biome].glow);
  // Perfect pulse: obstacle within 5m
  const bz=-ballMesh.position.z;
  for(const ch of chunks)
    for(const o of ch.obs)
      if(o.mesh.userData.active&&o.z-bz>0&&o.z-bz<5.5){
        G.slowmo=.22; G.slowmoT=.65;
        G.combo=Math.min(G.combo+2,24);
        showCombo(); flash('perfect-flash');
        G.camPunchY=-0.06;
        return;
      }
}

// ══════════════════════════════════════════
// BIOME
// ══════════════════════════════════════════
function checkBiome(){
  const idx=Math.floor(G.dist/C.BIOME_M)%BIOMES.length;
  if(idx===G.biome) return;
  G.biome=idx;
  const b=BIOMES[idx];
  scene.fog.color.setHex(b.fog); scene.background.setHex(b.fog);
  ballMesh.material.color.setHex(b.ball); ballMesh.material.emissive.setHex(b.ball);
  ballGlow.material.color.setHex(b.glow);
  ballLight.color.setHex(b.glow); pulseLight.color.setHex(b.glow);
  showBiome(b.name);
}

// ══════════════════════════════════════════
// BALL + CAMERA
// ══════════════════════════════════════════
let camTilt=0;

function moveBall(dt){
  const LM = latMax();
  const rawDx=(tdx+mdx)*.024;
  const kDx=(kR?1:0)-(kL?1:0);
  G.targetX+=rawDx+kDx*9*dt;
  G.targetX=Math.max(-LM,Math.min(LM,G.targetX));
  ballMesh.position.x+=(G.targetX-ballMesh.position.x)*C.LATSMOOTH;
  ballMesh.position.z-=G.speed*dt;
  ballMesh.rotation.z+=dt*2.8;
  ballGlow.position.copy(ballMesh.position);
  tdx*=.58; mdx*=.58;

  // Camera punch decays exponentially
  G.camPunchX*=0.82; G.camPunchY*=0.82;

  const tx=ballMesh.position.x*.72;
  camera.position.x+=(tx-camera.position.x)*.1;
  camera.position.x+=G.camPunchX;
  camera.position.z=ballMesh.position.z+C.CAM_BACK;
  camera.position.y=C.CAM_Y+G.camPunchY;
  camTilt+=(rawDx*1.7-camTilt)*.09;
  camera.rotation.z=-camTilt;
  camera.lookAt(ballMesh.position.x*.3,.12,ballMesh.position.z-C.CAM_LOOK);

  ballLight.position.copy(ballMesh.position);
  pulseLight.position.copy(ballMesh.position);
}

// ══════════════════════════════════════════
// GAME FLOW
// ══════════════════════════════════════════
function doStart(){
  initAudio(); snd.startAmb();
  document.getElementById('start-screen').classList.add('hidden');
  initWorld(); G.phase='playing';
  updLives(); updEnergy(); updScore();
}

function doRestart(){
  document.getElementById('gameover-screen').classList.add('hidden');
  snd.stopAmb(); snd.startAmb();
  initWorld(); G.phase='playing';
  updLives(); updEnergy(); updScore();
}

function initWorld(){
  const savedBest=G.best; resetG(); G.best=savedBest; G.phase='playing';
  for(const ch of chunks){
    scene.remove(ch.grp);
    ch.obs.forEach(o=>{o.mesh.visible=false;obsPool.push(o.mesh);});
    ch.cry.forEach(c=>{c.mesh.visible=false;cryPool.push(c.mesh);});
  }
  chunks.length=0; chunkZ=0;
  ballMesh.position.set(0,0,0); ballGlow.position.set(0,0,0);
  camera.position.set(0,C.CAM_Y,C.CAM_BACK);
  const b=BIOMES[0];
  scene.fog.color.setHex(b.fog); scene.background.setHex(b.fog); scene.fog.far=C.FOG_F;
  ballMesh.material.color.setHex(b.ball); ballMesh.material.emissive.setHex(b.ball);
  ballGlow.material.color.setHex(b.glow);
  ballLight.color.setHex(b.glow); pulseLight.color.setHex(b.glow); pulseLight.intensity=0;
  shockMat.opacity=0;
  manageChunks();
}

function showGameOver(){
  const d=Math.floor(G.dist), isNew=d>G.best;
  if(isNew){ G.best=d; localStorage.setItem('pm_best',String(d)); }
  document.getElementById('go-dist').textContent=d;
  document.getElementById('go-best-val').textContent=G.best;
  document.getElementById('new-best').classList.toggle('show',isNew);
  document.getElementById('gameover-screen').classList.remove('hidden');
  snd.stopAmb(); G.phase='over';
}

// ══════════════════════════════════════════
// UI
// ══════════════════════════════════════════
function updEnergy(){ document.getElementById('energy-bar').style.width=(G.energy*100)+'%'; }
function updScore(){
  document.getElementById('score').textContent=Math.floor(G.dist);
  document.getElementById('best-val').textContent=Math.max(Math.floor(G.dist),G.best);
  document.getElementById('speed-val').textContent=Math.round(G.speed)+' م/ث';
}
function updLives(){
  for(let i=0;i<C.LIVES;i++) document.getElementById('h'+i).classList.toggle('dead',i>=G.lives);
}
let comboTimer=null;
function showCombo(){
  if(G.combo<2) return;
  const el=document.getElementById('combo');
  el.textContent='×'+G.combo;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  snd.combo(G.combo);
  clearTimeout(comboTimer); comboTimer=setTimeout(()=>el.classList.remove('show'),950);
}
function flash(id){
  const el=document.getElementById(id);
  el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),160);
}
function showBiome(name){
  const el=document.getElementById('biome');
  document.getElementById('biome-name').textContent=name;
  el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2600);
}
let mileTimer=null;
function showMile(text){
  const el=document.getElementById('milestone');
  el.textContent='🏁 '+text; el.classList.add('show');
  clearTimeout(mileTimer); mileTimer=setTimeout(()=>el.classList.remove('show'),1900);
}

// ══════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════
const clock=new THREE.Clock();
let totalTime=0;

function loop(){
  requestAnimationFrame(loop);
  const rawDt=Math.min(clock.getDelta(),.05);
  totalTime+=rawDt;

  if(G.phase!=='playing'){ composer.render(); return; }

  if(G.slowmoT>0){ G.slowmoT-=rawDt; if(G.slowmoT<=0) G.slowmo=1; }
  const dt=rawDt*G.slowmo;

  // Exponential speed ramp
  G.speed = Math.min(C.SPD0 * Math.pow(C.SPD_BASE, G.dist/C.SPD_SCALE), C.SPDMAX);

  moveBall(dt);
  G.dist+=G.speed*dt;

  // Near-miss cooldown
  if(G.nearMissTimer>0) G.nearMissTimer-=rawDt;

  // Invincibility blink
  if(G.invinc){
    G.invincT-=rawDt;
    ballMesh.visible=ballGlow.visible=Math.sin(G.invincT*18)>0;
    if(G.invincT<=0){ G.invinc=false; ballMesh.visible=ballGlow.visible=true; }
  }

  // Pulse fog expansion
  if(G.pulsing){
    G.pulseT-=rawDt;
    const t=Math.max(0,G.pulseT/C.PULSE_DUR);
    scene.fog.far=C.FOG_N+(C.FOG_F-C.FOG_N)*t+(C.PULSE_FOG-C.FOG_F)*(1-t);
    pulseLight.intensity=(1-t)*9;
    if(G.pulseT<=0){ G.pulsing=false; pulseLight.intensity=0; }
  } else {
    scene.fog.far+=(C.FOG_F-scene.fog.far)*.045;
  }

  // Shockwave expand
  if(shockLife>0){
    shockLife-=rawDt*2.3; shockScale+=rawDt*20;
    shockRing.scale.setScalar(shockScale);
    shockRing.position.copy(ballMesh.position);
    shockMat.opacity=Math.max(0,shockLife*.72);
  }

  // Screen shake
  if(G.shakeI>.001){
    G.shakeI*=(1-C.SHAKE_DEC*rawDt);
    camera.position.x+=(Math.random()-.5)*G.shakeI;
    camera.position.y+=(Math.random()-.5)*G.shakeI;
  }

  // Dynamic bloom scales with speed
  const speedT = Math.max(0,(G.speed-C.SPD0)/(C.SPDMAX-C.SPD0));
  const targetBloom = 1.2 + speedT*0.9;
  bloom.strength += (targetBloom - bloom.strength)*0.04;

  // Decay CA + glitch
  G.caStrength    *= 0.88;
  G.glitchStrength*= 0.84;

  // Update PostFX uniforms
  fxPass.uniforms.caStrength.value  = G.caStrength;
  fxPass.uniforms.glitchStr.value   = G.glitchStrength;
  fxPass.uniforms.time.value        = totalTime;

  G.energy=Math.min(1,G.energy+C.ENERGY_REG);
  updEnergy();
  updateTrail(dt);
  updateParticles(dt);
  updateSpeedLines();

  // Animate obstacles — CW gap narrows as ball approaches
  for(const ch of chunks){
    for(const o of ch.obs){
      if(!o.mesh.userData.active) continue;
      if(o.type==='pillar'){
        o.mesh.userData.core.rotation.y+=dt*1.6;
        o.mesh.userData.ring.rotation.z+=dt*o.mesh.userData.rotSpeed;
        const s=1+Math.sin(Date.now()*.003+o.z)*.09;
        o.mesh.userData.core.scale.setScalar(s);
      } else {
        if(o.mesh.userData.isCW){
          // Closing wall: gap narrows based on Z proximity to ball
          const bz=-ballMesh.position.z;
          const dist=o.z-bz;
          if(dist>0&&dist<30){
            const progress=1-(dist/30);
            const initW=o.mesh.userData.cwInitW;
            const minW=o.mesh.userData.cwMinW;
            const gw=initW - (initW-minW)*progress;
            o.mesh.userData.gapW=gw;
            const gx=o.mesh.userData.gapX;
            o.mesh.userData.L.position.x=gx-gw/2-1.2;
            o.mesh.userData.R.position.x=gx+gw/2+1.2;
          }
        } else if(o.mesh.userData.slides){
          const shift=Math.sin((G.dist/G.speed)*o.mesh.userData.slideSpd+o.mesh.userData.slidePhase)*1.4;
          const gx=o.mesh.userData.gapX+shift;
          const gw=o.mesh.userData.gapW;
          o.mesh.userData.L.position.x=gx-gw/2-1.2;
          o.mesh.userData.R.position.x=gx+gw/2+1.2;
          o.mesh.userData.currentGapX=gx;
        }
      }
    }
    for(const c of ch.cry){
      if(!c.hit){
        c.mesh.rotation.y+=dt*2.3;
        c.mesh.position.y=Math.sin(Date.now()*.002+c.z)*.22;
      }
    }
  }

  checkCollisions();
  manageChunks();
  checkBiome();
  updScore();

  const mile=Math.floor(G.dist/100);
  if(mile>G.lastMile){ G.lastMile=mile; showMile(mile*100+' متر'); }

  composer.render();
}

// ══════════════════════════════════════════
// RESIZE + BOOT
// ══════════════════════════════════════════
window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  composer.setSize(innerWidth,innerHeight);
  bloom.resolution.set(innerWidth,innerHeight);
});

document.getElementById('btn-start').addEventListener('click',doStart);
document.getElementById('btn-retry').addEventListener('click',doRestart);
setupInput();

if(G.best>0) document.getElementById('best-val').textContent=G.best;
loop();
</script>
